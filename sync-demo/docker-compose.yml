# Two independent sync servers, one Nginx front proxy, and one client on a
# private bridge, all TLS-enabled. The client lists both servers directly in
# priority order (SYNC_SERVERS) and fails over between them. The front proxy
# is optional and used only by the 04_stealth_mode scenario to simulate domain
# fronting; the default client does not use it.
#
# Run ./certs/gen_certs.sh once before `up`. The generated keys are
# gitignored and for this demo only.
#
#   ./certs/gen_certs.sh
#   docker compose up --build          # then run ./scenarios/*.sh
#   docker compose down -v             # reset all state

services:
  primary-server:
    build: ./server
    container_name: sync-server-primary
    environment:
      - SYNC_DATA_DIR=/data
      - SYNC_PORT=8000
      - SYNC_TLS_CERT=/certs/server.crt
      - SYNC_TLS_KEY=/certs/server.key
    volumes:
      - primary-data:/data
      - ./certs:/certs:ro
    networks:
      - sync-network
    ports:
      - "8000:8000"                 # direct access for stats and file checks
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/certs/ca.crt", "https://localhost:8000/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  secondary-server:
    build: ./server
    container_name: sync-server-secondary
    environment:
      - SYNC_DATA_DIR=/data
      - SYNC_PORT=8001
      - SYNC_TLS_CERT=/certs/server.crt
      - SYNC_TLS_KEY=/certs/server.key
    volumes:
      - secondary-data:/data
      - ./certs:/certs:ro
    networks:
      - sync-network
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/certs/ca.crt", "https://localhost:8001/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  front-proxy:
    image: nginx:alpine
    container_name: sync-front
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    ports:
      - "8443:443"                  # external access point for stealth mode
    networks:
      - sync-network
    depends_on:
      primary-server:
        condition: service_healthy
      secondary-server:
        condition: service_healthy

  client:
    build: ./client
    container_name: sync-client
    environment:
      - SYNC_SERVERS=https://primary-server:8000,https://secondary-server:8001
      - SYNC_CA_BUNDLE=/certs/ca.crt
      - SYNC_ROOTS=/data/sync
      - SYNC_STATE_DB=/state/client.db
      - SYNC_INTERVAL=3
      - SYNC_HEALTH_CHECK_INTERVAL=10
    volumes:
      - ./sync-root:/data/sync
      - client-state:/state
      - ./certs:/certs:ro
    networks:
      - sync-network
    cap_add:
      - NET_ADMIN                   # lets the network scenarios run tc/netem inside
    depends_on:
      primary-server:
        condition: service_healthy
      secondary-server:
        condition: service_healthy

networks:
  sync-network:
    driver: bridge

volumes:
  primary-data:
  secondary-data:
  client-state: