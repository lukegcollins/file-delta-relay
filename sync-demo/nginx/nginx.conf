events {
    worker_connections 1024;
}

http {
    upstream sync_backend {
        # The two backends are independent, non-replicating stores, and a file
        # sync is a stateful multi-request transaction (query missing chunks ->
        # upload -> commit -> later read-back). Every request about a given file
        # must reach the same store, including the read-back that verifies it,
        # which may come from a different client than the uploader. Round-robin
        # or ip_hash would split those across both stores and the commit (or the
        # verify) would miss its chunks. The front proxy is a single innocent-
        # looking entry point, so it forwards to one backend. The secondary
        # stays as a commented-out failover target for the demo.
        server primary-server:8000;
        # server secondary-server:8001;   # non-replicating failover; enable by hand
    }

    server {
        listen 443 ssl;
        server_name innocent-front.example.com;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        location / {
            proxy_pass https://sync_backend;
            # The backends serve the same demo cert this proxy itself uses
            # (SAN includes primary-server/secondary-server), issued by the
            # demo CA at /certs/ca.crt -- so upstream TLS can be verified
            # properly instead of skipped, at zero extra cost. nginx checks
            # the *upstream block's* name ("sync_backend") against the SAN
            # by default, which isn't in it; proxy_ssl_name points hostname
            # verification at the real backend name that is.
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name primary-server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}